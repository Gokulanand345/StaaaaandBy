# Build check only. StaaaaandBy is distributed as source (no APK on Releases): the lyric video
# and Spotify Web API features are for personal use under Spotify's developer policy, see README.
name: Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # gradle.properties の org.gradle.java.home はローカルMac用なのでCIでは上書きする
      - name: Build debug APK
        run: ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StaaaaandBy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
